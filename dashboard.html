<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="dashboard-header">
            <h2>Dashboard</h2>
            <p>Welcome, Admin. You are logged in and can manage the application.</p>
        </div>

        <div class="dashboard-cards">
            <div class="card">
                <h3>Total Users</h3>
                <p>1</p>
            </div>
            <div class="card">
                <h3>Active Sessions</h3>
                <p>1</p>
            </div>
        </div>

        <button id="logout-btn">Logout</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCqLFv3F9-3HAS7m7OIyCLD3M86KaRltN4",
            authDomain: "test-project-58ac0.firebaseapp.com",
            projectId: "test-project-58ac0",
            storageBucket: "test-project-58ac0.firebasestorage.app",
            messagingSenderId: "10691087045",
            appId: "1:10691087045:web:92637a0ab765882ce5feac",
            measurementId: "G-YHEPWY3EJC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const logoutBtn = document.getElementById('logout-btn');

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'index.html';
            }
        });

        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
