<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="dashboard-header">
            <h2>Admin Dashboard</h2>
            <p>Welcome back, admin. Monitor system status and manage key controls.</p>
        </div>

        <div class="dashboard-cards">
            <div class="card">
                <h3>System Status</h3>
                <p id="status-value">Healthy</p>
            </div>
            <div class="card">
                <h3>Active Admin</h3>
                <p>admin</p>
            </div>
            <div class="card">
                <h3>Last Login</h3>
                <p id="last-login">Loading...</p>
            </div>
            <div class="card">
                <h3>Firebase User</h3>
                <p id="user-email">Loading...</p>
            </div>
        </div>

        <button id="logout-btn">Logout</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBPd2SeDOQ7x0nnShwKqykAn_zNkgx9t4Y",
            authDomain: "test-f52a6.firebaseapp.com",
            projectId: "test-f52a6",
            storageBucket: "test-f52a6.firebasestorage.app",
            messagingSenderId: "276833014789",
            appId: "1:276833014789:web:7ff8d9c5f8409533e6386c",
            measurementId: "G-BSLWX7RKNE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const logoutBtn = document.getElementById('logout-btn');
        const lastLogin = document.getElementById('last-login');
        const userEmail = document.getElementById('user-email');

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            lastLogin.textContent = localStorage.getItem('lastAdminLogin') || 'Not available';
            userEmail.textContent = user.email || 'admin@test-f52a6.firebaseapp.com';
        });

        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
