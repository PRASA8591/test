<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS Management System | Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-900 text-slate-100">
  <div class="min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md rounded-3xl border border-slate-800/80 bg-slate-950/90 p-8 shadow-2xl shadow-slate-950/40 backdrop-blur-sm">
      <div class="text-center space-y-4">
        <div class="mx-auto flex h-20 w-20 items-center justify-center rounded-3xl bg-indigo-600/20 text-indigo-300 ring-1 ring-indigo-500/30">
          <span class="text-4xl font-black">P</span>
        </div>
        <div>
          <h1 class="text-3xl font-semibold">POS Management System</h1>
          <p class="mt-2 text-slate-400">Secure offline login for the local point-of-sale system.</p>
        </div>
      </div>

      <form id="login-form" class="mt-10 space-y-5">
        <div>
          <label class="block text-sm font-semibold text-slate-300" for="username">Username</label>
          <input id="username" type="text" autocomplete="username" placeholder="admin" class="mt-2 w-full rounded-2xl border border-slate-700 bg-slate-900 px-4 py-3 text-slate-100 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" />
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-300" for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="admin123" class="mt-2 w-full rounded-2xl border border-slate-700 bg-slate-900 px-4 py-3 text-slate-100 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" />
        </div>

        <div class="flex items-center gap-3">
          <input id="remember" type="checkbox" class="h-4 w-4 rounded border-slate-600 bg-slate-800 text-indigo-500 focus:ring-indigo-400" />
          <label for="remember" class="text-sm text-slate-400">Remember Me</label>
        </div>

        <button type="submit" class="w-full rounded-2xl bg-indigo-500 px-5 py-3 text-base font-semibold text-white transition hover:bg-indigo-400">Login</button>
        <p class="text-center text-sm text-slate-500">Default admin: <span class="font-semibold text-slate-100">admin</span> / <span class="font-semibold text-slate-100">admin123</span></p>
        <div id="login-message" class="rounded-2xl p-4 text-sm font-medium hidden"></div>
      </form>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
