<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory | POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-950 text-slate-100">
  <div class="min-h-screen flex flex-col lg:flex-row">
    <div id="sidebar-root" class="w-full lg:w-72"></div>
    <div class="flex-1">
      <div id="navbar-root"></div>
      <main class="mx-auto max-w-7xl px-4 py-6 lg:px-8">
        <div class="grid gap-6 xl:grid-cols-[1.1fr_0.9fr]">
          <section class="rounded-3xl border border-slate-800/90 bg-slate-900/80 p-6 shadow-xl shadow-slate-950/20">
            <div class="flex items-center justify-between">
              <div>
                <h1 class="text-2xl font-semibold">Inventory</h1>
                <p class="mt-1 text-slate-400">Track all stock movements and current quantities.</p>
              </div>
              <button id="refresh-inventory" class="rounded-2xl border border-slate-700 px-4 py-2 text-sm text-slate-200 transition hover:border-indigo-500 hover:text-white">Refresh</button>
            </div>

            <div class="mt-6 overflow-x-auto rounded-3xl border border-slate-800/90 bg-slate-950/60 p-4">
              <table class="min-w-full text-left text-sm text-slate-300">
                <thead class="border-b border-slate-700/80 text-slate-400">
                  <tr>
                    <th class="py-3">Date</th>
                    <th class="py-3">Product</th>
                    <th class="py-3">Type</th>
                    <th class="py-3">Qty</th>
                  </tr>
                </thead>
                <tbody id="stock-log-body" class="divide-y divide-slate-800/80"></tbody>
              </table>
            </div>
          </section>

          <aside class="rounded-3xl border border-slate-800/90 bg-slate-900/80 p-6 shadow-xl shadow-slate-950/20">
            <h2 class="text-xl font-semibold">Stock Adjustment</h2>
            <form id="stock-form" class="mt-6 space-y-4">
              <label class="block text-sm text-slate-400">Product Barcode<input id="stock-barcode" class="mt-2 w-full rounded-2xl border border-slate-700 bg-slate-900 px-4 py-3 text-slate-100 outline-none" placeholder="123456789" /></label>
              <label class="block text-sm text-slate-400">Type<select id="stock-type" class="mt-2 w-full rounded-2xl border border-slate-700 bg-slate-900 px-4 py-3 text-slate-100 outline-none"><option value="in">Stock In</option><option value="out">Stock Out</option></select></label>
              <label class="block text-sm text-slate-400">Quantity<input id="stock-qty" type="number" min="1" value="1" class="mt-2 w-full rounded-2xl border border-slate-700 bg-slate-900 px-4 py-3 text-slate-100 outline-none" /></label>
              <button type="submit" class="w-full rounded-2xl bg-indigo-500 px-5 py-3 text-sm font-semibold text-white transition hover:bg-indigo-400">Update Inventory</button>
              <div id="stock-message" class="rounded-2xl p-4 text-sm font-medium hidden"></div>
            </form>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="js/inventory.js"></script>
</body>
</html>
