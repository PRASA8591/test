<!DOCTYPE html>
<html>
<head>
  <title>POS System - Test Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-8">
  <div class="max-w-2xl mx-auto space-y-6">
    <h1 class="text-3xl font-bold mb-6">POS System - System Health Check</h1>
    
    <div id="tests" class="space-y-4">
      <div class="p-4 rounded-lg bg-slate-900 border border-slate-800">
        <h3 class="font-semibold mb-2">⏳ Running tests...</h3>
        <p class="text-slate-400">Please wait for all tests to complete.</p>
      </div>
    </div>

    <div class="p-4 rounded-lg bg-slate-900 border border-slate-800 mt-8">
      <h2 class="font-semibold mb-4">Quick Actions</h2>
      <div class="space-y-2">
        <a href="index.html" class="block w-full bg-indigo-600 hover:bg-indigo-500 rounded-lg px-4 py-2 text-center font-semibold">Go to Login</a>
        <a href="dashboard.html" class="block w-full bg-slate-700 hover:bg-slate-600 rounded-lg px-4 py-2 text-center font-semibold">Go to Dashboard (if authenticated)</a>
      </div>
    </div>
  </div>

  <script type="module">
    const testsDiv = document.getElementById('tests');
    
    async function runTests() {
      const results = [];
      
      // Test 1: Dexie Import
      try {
        const response = await fetch('https://unpkg.com/dexie@3.2.4/dist/dexie.mjs');
        if (response.ok) {
          results.push({ name: 'Dexie CDN', status: 'pass', msg: 'Module available at unpkg.com' });
        } else {
          results.push({ name: 'Dexie CDN', status: 'warn', msg: `HTTP ${response.status}` });
        }
      } catch (e) {
        results.push({ name: 'Dexie CDN', status: 'fail', msg: e.message });
      }
      
      // Test 2: IndexedDB Support
      try {
        const supported = !!window.indexedDB;
        if (supported) {
          results.push({ name: 'IndexedDB Support', status: 'pass', msg: 'Browser supports IndexedDB' });
        } else {
          results.push({ name: 'IndexedDB Support', status: 'fail', msg: 'IndexedDB not supported' });
        }
      } catch (e) {
        results.push({ name: 'IndexedDB Support', status: 'fail', msg: e.message });
      }
      
      // Test 3: LocalStorage
      try {
        localStorage.setItem('test_key', 'test_value');
        localStorage.removeItem('test_key');
        results.push({ name: 'LocalStorage', status: 'pass', msg: 'LocalStorage working' });
      } catch (e) {
        results.push({ name: 'LocalStorage', status: 'fail', msg: e.message });
      }
      
      // Test 4: CSS Loading
      try {
        const cssLink = 'css/style.css';
        const response = await fetch(cssLink);
        if (response.ok) {
          results.push({ name: 'Custom CSS', status: 'pass', msg: 'Style sheet loaded' });
        } else {
          results.push({ name: 'Custom CSS', status: 'warn', msg: `HTTP ${response.status}` });
        }
      } catch (e) {
        results.push({ name: 'Custom CSS', status: 'fail', msg: e.message });
      }
      
      // Test 5: Auth Module
      try {
        const response = await fetch('js/auth.js');
        if (response.ok) {
          results.push({ name: 'Auth Module', status: 'pass', msg: 'Module file available' });
        } else {
          results.push({ name: 'Auth Module', status: 'fail', msg: `HTTP ${response.status}` });
        }
      } catch (e) {
        results.push({ name: 'Auth Module', status: 'fail', msg: e.message });
      }
      
      // Test 6: Database Module
      try {
        const response = await fetch('database/db.js');
        if (response.ok) {
          results.push({ name: 'Database Module', status: 'pass', msg: 'Module file available' });
        } else {
          results.push({ name: 'Database Module', status: 'fail', msg: `HTTP ${response.status}` });
        }
      } catch (e) {
        results.push({ name: 'Database Module', status: 'fail', msg: e.message });
      }
      
      // Render results
      testsDiv.innerHTML = results.map(result => `
        <div class="p-4 rounded-lg border ${result.status === 'pass' ? 'bg-green-500/10 border-green-500/30' : result.status === 'warn' ? 'bg-yellow-500/10 border-yellow-500/30' : 'bg-red-500/10 border-red-500/30'}">
          <div class="flex items-center gap-3">
            <span class="text-2xl">${result.status === 'pass' ? '✓' : result.status === 'warn' ? '⚠' : '✗'}</span>
            <div>
              <h3 class="font-semibold">${result.name}</h3>
              <p class="text-sm text-slate-400">${result.msg}</p>
            </div>
          </div>
        </div>
      `).join('');
    }
    
    // Run tests on page load
    window.addEventListener('load', runTests);
  </script>
</body>
</html>
