<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="text-center mb-6">
            <h2 id="header-title">Admin Login</h2>
            <p id="header-subtitle">Login with your admin account to access the dashboard.</p>
        </div>

        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="admin" autocomplete="username">
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="8591" autocomplete="current-password">
        </div>

        <button id="login-btn">Login</button>
        <p class="note">Use admin credentials: <strong>admin</strong> / <strong>8591</strong></p>

        <div id="message-container" class="hidden"></div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
