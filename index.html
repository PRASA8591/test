<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Mobile Verification</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css">
    
    <style>
        /* Custom overrides to make intl-tel-input play nice with Tailwind */
        .iti { width: 100%; display: block; }
        .iti__flag-container { z-index: 10; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <div class="text-center mb-6">
            <h2 id="header-title" class="text-2xl font-bold text-gray-800">Secure Verification</h2>
            <p id="header-subtitle" class="text-sm text-gray-500 mt-1">Enter your mobile number to continue</p>
        </div>
        
        <div id="step-1" class="space-y-4">
            <div>
                <input type="tel" id="phone" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" />
            </div>
            <button id="send-otp-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition-colors disabled:bg-blue-300 disabled:cursor-not-allowed">
                Send OTP
            </button>
        </div>

        <div id="recaptcha-container"></div>

        <div id="step-2" class="space-y-4 hidden">
            <div>
                <input type="text" id="otp-code" placeholder="Enter 6-digit code" maxlength="6" class="w-full px-4 py-3 border border-gray-300 rounded-lg text-center text-xl tracking-widest focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
            </div>
            <button id="verify-otp-btn" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition-colors disabled:bg-green-300 disabled:cursor-not-allowed">
                Verify Mobile
            </button>
            
            <div class="text-center mt-4">
                <button id="resend-btn" class="text-sm text-blue-600 font-medium disabled:text-gray-400 disabled:cursor-not-allowed" disabled>
                    Resend Code <span id="timer">(60s)</span>
                </button>
            </div>
        </div>

        <div id="message-container" class="mt-4 p-3 rounded-lg hidden text-sm font-medium text-center"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>
    
    <script type="module" src="script.js"></script>
</body>
</html>
